[package]
name = "chatroom"
version = "0.1.0"
edition = "2021"
authors = ["stepcloud-chatroom"]
description = "High-performance WebSocket chatroom server rewritten in Rust"

[dependencies]
actix-web = "4"
actix-files = "0.6"
actix-ws = "0.4"

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
lazy_static = "1.4.0"
log = "0.4"
env_logger = "0.10"
chrono = "0.4"
base64 = "0.22"
